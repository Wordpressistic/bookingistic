name: Feature request
description: Suggest an idea or improvement for Bookingistic.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The more concrete the use case, the easier it is to prioritize.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to achieve, and what's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Screenshots or sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: audience
    attributes:
      label: Who are you?
      options:
        - Site owner / non-technical
        - Developer / agency
        - Other
    validations:
      required: true
